<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه «کتاب‌یاب» کتابخانه هنرهای زیبا</title>
<style>
:root{--navy:#173b59;--blue:#28658e;--ink:#193044;--muted:#64748b;--bg:#eef4f7;--card:#fff;--gold:#dba84b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Vazirmatn,Arial,sans-serif;line-height:1.8}header{background:linear-gradient(135deg,#12334e,#2f7297);color:#fff;padding:22px 16px 28px;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:14px}.brand img{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#fff;padding:5px;display:none}.brand img.ready{display:block}.brand h1{font-size:1.45rem;margin:0 0 3px}.brand p{margin:0;opacity:.87;font-size:.82rem}.wrap{max-width:920px;margin:auto;padding:18px 14px 54px}.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 3px 16px #163b5914;margin-bottom:14px}.search-row{display:flex;gap:9px}.search-row input,.search-row select{border:2px solid #dce6ed;border-radius:11px;padding:11px 12px;background:#f8fbfc;font:inherit;outline:0}.search-row input{flex:1}.search-row input:focus,.search-row select:focus{border-color:var(--blue);background:#fff}.search-row select{width:145px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.pill,.link{border:1px solid #cbd8e1;background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font:inherit;font-size:.82rem;color:var(--ink)}.pill.active,.pill:hover{background:var(--navy);border-color:var(--navy);color:#fff}.stats{color:var(--muted);font-size:.78rem;margin-top:8px;display:flex;justify-content:space-between}.results{display:grid;gap:10px}.book{background:#fff;border-radius:14px;padding:14px 15px;border-right:5px solid var(--blue);display:flex;justify-content:space-between;gap:14px}.book.en{border-right-color:#8b5cf6}.book h3{font-size:.96rem;margin:0 0 4px}.book p{font-size:.79rem;color:#536575;margin:1px 0}.code{direction:ltr;display:inline-block;background:#f1f5f9;border:1px solid #d6e0e6;border-radius:6px;padding:1px 8px;font: .76rem monospace;color:#173b59;margin-top:5px}.shelf{align-self:center;white-space:nowrap;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;font-size:.78rem}.shelf:hover{background:var(--blue)}.hint,.empty{text-align:center;color:#8495a3;padding:28px 10px}.quick h2{font-size:1rem;margin:0 0 10px;color:var(--navy)}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quick a,.quick button{display:block;text-decoration:none;color:var(--ink);background:#f7fafb;border:1px solid #e0e9ee;border-radius:10px;padding:8px 10px;font:inherit;font-size:.8rem;text-align:center;cursor:pointer}.quick a:hover,.quick button:hover{background:#eaf3f7;border-color:#9cc2d3}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;z-index:3}.modal.hidden{display:none}.dialog{background:#fff;border-radius:17px;max-width:650px;width:100%;padding:20px;position:relative;max-height:92vh;overflow:auto}.close{position:absolute;left:13px;top:8px;border:0;background:none;font-size:1.8rem;color:#94a3b8;cursor:pointer}.dialog h2{margin:0 28px 2px 0;font-size:1.05rem}.caption{color:var(--blue);font-size:.85rem;font-weight:bold}.dialog img{display:block;width:100%;max-height:60vh;object-fit:contain;border:1px solid #dce6ed;border-radius:10px;background:#f8fafb;margin-top:10px}.dialog code{display:block;text-align:center;margin-top:7px;color:#81909c;direction:ltr}.modal-link{display:inline-block;color:#17648c;font-weight:bold;text-decoration:none;border-bottom:1px solid #17648c}.modal-action{border:0;border-radius:9px;background:#173b59;color:#fff;padding:8px 14px;font:inherit;cursor:pointer}.modal-action:hover{background:#28658e}@media(max-width:580px){.search-row{flex-direction:column}.search-row select{width:100%}.book{flex-direction:column}.shelf{width:100%}.quick-grid{grid-template-columns:1fr}.brand h1{font-size:1.13rem}}
</style>
</head>
<body>
<header><div class="brand"><img id="logo" src="assets/logo.png" alt="لوگوی کتابخانه" onload="this.classList.add('ready')"><div><h1>سامانه «کتاب‌یاب» کتابخانه هنرهای زیبا</h1><p>جستجو در مجموعه کتاب‌های فارسی و لاتین کتابخانه</p></div></div></header>
<main class="wrap">
<section class="card"><div class="search-row"><select id="field" aria-label="فیلد جستجو"><option value="all">همه موارد</option><option value="title">عنوان</option><option value="author">مؤلف</option><option value="topic">موضوع</option><option value="code">شماره رده‌بندی</option></select><input id="q" disabled placeholder="عبارت جستجو را وارد کنید…" autocomplete="off"></div><div class="filters" id="langs"><button class="pill active" data-lang="all">همه</button><button class="pill" data-lang="fa">فارسی</button><button class="pill" data-lang="en">لاتین</button></div><div class="stats"><span id="status">در حال بارگذاری…</span><span>کتابخانه هنرهای زیبا</span></div></section>
<section class="results" id="results"><div class="hint">در حال بارگذاری اطلاعات کتاب‌ها…</div></section>
<section class="card quick"><h2>دسترسی سریع</h2><div class="quick-grid">
<button onclick="showWebsite()">🌐 وب‌سایت کتابخانه</button><button onclick="showGuideline()">📘 شیوه‌نامه نگارش پایان‌نامه</button><button onclick="showThesis()">📋 فهرست پایان‌نامه‌ها</button><button onclick="openExternal('https://t.me/libfaut')">📣 کانال تلگرام</button><button onclick="openExternal('https://instagram.com/libfaut')">📷 صفحه اینستاگرام</button><button onclick="openExternal('https://anyflip.com/ixkcm/rfzu/')">📄 بروشور کتابخانه</button><button onclick="showContact()">☎️ اطلاعات تماس</button><button onclick="showReport()">🛠 گزارش مشکل</button><button onclick="openExternal('https://lib.ut.ac.ir/faces/home.jspx')">🗂 سامانه آذرسا</button></div></section>
</main>
<div class="modal hidden" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">×</button><h2 id="mTitle"></h2><div class="caption" id="mCaption"></div><div id="mBody"></div></div></div>
<script src="shelf-ranges.js"></script>
<script>
let BOOKS=[],lang='all',timer;const $=id=>document.getElementById(id);
function norm(s){return String(s||'').replace(/[أإآا]/g,'ا').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u065F]/g,'').toLowerCase().trim()}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
fetch('books_clean.json').then(r=>{if(!r.ok)throw Error('کد '+r.status);return r.json()}).then(d=>{BOOKS=d;$('q').disabled=false;$('status').textContent='تعداد کتاب‌ها: '+d.length.toLocaleString('fa-IR');$('results').innerHTML='<div class="hint">برای جستجو تایپ کنید…</div>'}).catch(e=>{$('status').textContent='خطا در بارگذاری: '+e.message;$('results').innerHTML='<div class="empty">فایل books_clean.json کنار سامانه پیدا نشد.</div>'});
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,180)});$('field').addEventListener('change',search);$('langs').addEventListener('click',e=>{let b=e.target.closest('[data-lang]');if(!b)return;document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');lang=b.dataset.lang;search()});
function search(){let q=norm($('q').value),field=$('field').value;if(q.length<2){$('results').innerHTML='<div class="hint">برای جستجو حداقل دو حرف وارد کنید…</div>';return}let terms=q.split(/\s+/),pool=lang==='all'?BOOKS:BOOKS.filter(b=>b.l===lang),out=[];for(let b of pool){let vals={title:norm(b.t),author:norm(b.a),topic:norm(b.cat),code:norm(b.c),all:norm([b.t,b.a,b.cat,b.c].join(' '))},text=vals[field]||vals.all,score=0;for(let term of terms)if(text.includes(term))score+=(field==='all'?(vals.title.includes(term)?4:vals.author.includes(term)?3:vals.code.includes(term)?5:1):3);if(score)out.push({score,b})}out.sort((a,b)=>b.score-a.score);out=out.slice(0,40);$('results').innerHTML=out.length?out.map(x=>card(x.b)).join(''):'<div class="empty">📭 کتابی یافت نشد.</div>'}
function card(b){return `<article class="book ${b.l==='en'?'en':''}"><div><h3>${esc(b.t||'بدون عنوان')}</h3><p>✍️ ${esc(b.a||'نامشخص')}</p>${b.y?`<p>📅 ${esc(b.y)}</p>`:''}${b.cat?`<p>🏷️ ${esc(b.cat)}</p>`:''}<span class="code">${esc(b.c||'-')}</span></div><button class="shelf" onclick='showShelf(${JSON.stringify(b.c||'')},${JSON.stringify(b.l||'fa')})'>📍 موقعیت قفسه</button></article>`}
function codeParts(code){let s=String(code||'').toUpperCase().replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x)).replace(/[أإآ]/g,'A').replace(/[^A-Z0-9]/g,' ');let m=s.match(/([A-Z]+)\s*(\d+)/);return m?{letters:m[1],num:+m[2]}:null}
function rangeParts(x){let m=String(x).toUpperCase().match(/^([A-Z]+)(\d+)/);return m?{letters:m[1],num:+m[2]}:{letters:String(x).replace(/\d.*/,''),num:0}}
function shelfFor(code,kind){let p=codeParts(code),ranges=(window.SHELF_RANGES||{})[kind==='en'?'latin':'persian']||[];if(!p)return null;let hits=ranges.filter(r=>{let a=rangeParts(r[0]),z=rangeParts(r[1]);return a.letters<=p.letters&&p.letters<=z.letters&&!(p.letters===a.letters&&p.num<a.num)&&!(p.letters===z.letters&&p.num>z.num)});hits.sort((x,y)=>{let ax=rangeParts(x[0]),ay=rangeParts(y[0]);return (ax.letters===p.letters?0:1)-(ay.letters===p.letters?0:1)||Math.abs(rangeParts(x[1]).num-ax.num)-Math.abs(rangeParts(y[1]).num-ay.num)});return hits[0]}
const caps=n=>{let row=Math.floor((n-1)/18)+1,pos=(n-1)%18+1;return `ردیف ${['اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم'][row-1]||row} / قفسه ${pos<=9?(pos===8?'انتهای ردیف':`شماره ${pos} از سمت چپ`):`شماره ${18-pos+1} از سمت راست`}`};
function showShelf(code,kind){let hit=shelfFor(code,kind),file=hit&&hit[2],num=file?parseInt(file):null;$('mTitle').textContent=num?'قفسه شماره '+num:'موقعیت قفسه';$('mCaption').textContent=num?'📍 '+caps(num):'برای این شماره رده‌بندی محدوده‌ای ثبت نشده است.';$('mBody').innerHTML=`<img src="Shelves/${file||'0.jpg'}" alt="تصویر قفسه" onerror="this.style.display='none'"><code>شماره رده‌بندی: ${esc(code)} — ${kind==='en'?'قفسه‌های لاتین':'قفسه‌های فارسی'}</code>`;$('modal').classList.remove('hidden')}
function openExternal(url){const w=window.open(url,'_blank','noopener,noreferrer');if(!w)window.location.href=url}
function showWebsite(){openText('وب‌سایت کتابخانه','برای ورود به وب‌سایت کتابخانه هنرهای زیبا روی لینک زیر کلیک کنید:<br><br><a class="modal-link" href="https://finearts.ut.ac.ir/lib" target="_blank" rel="noopener">ورود به وب‌سایت کتابخانه</a>')}
function showGuideline(){openText('شیوه‌نامه نگارش پایان‌نامه','شیوه‌نامه نگارش پایان‌نامه از لینک زیر قابل دریافت است:<br><br><a class="modal-link" href="https://b2n.ir/u66582" target="_blank" rel="noopener">مشاهده شیوه‌نامه</a>')}
function showThesis(){openText('فهرست پایان‌نامه‌ها','برای مشاهده و دریافت فهرست پایان‌نامه‌ها و رساله‌های موجود، از لینک زیر استفاده کنید:<br><br><a class="modal-link" href="https://docs.google.com/spreadsheets/d/1QcmNDmMk5n8mso2bIlz4R-0l5j3i7Y-M/edit?usp=drive_link&ouid=114150535739933560745&rtpof=true&sd=true" target="_blank" rel="noopener">مشاهده فهرست پایان‌نامه‌ها</a><br><br>همچنین می‌توانید در کانال تلگرام کتابخانه عبارت «فهرست پایان‌نامه‌ها» را جستجو کنید.')}
function showContact(){openText('اطلاعات تماس','۶۶۴۹۹۶۸۰ — میز امانت (جهت تمدید کتاب‌ها)<br>۶۱۱۱۲۷۵۵ — خدمات فنی و فهرست‌نویسی<br>۶۱۱۱۳۲۴۶ — بخش پایان‌نامه‌ها')}
function showReport(){openText('گزارش مشکل','برای گزارش مشکل، لطفاً به آیدی <a class="modal-link" href="https://t.me/alireza_e_j" target="_blank" rel="noopener">@alireza_e_j</a> در تلگرام پیام دهید.<br><br><button class="modal-action" onclick="openExternal(\'https://t.me/alireza_e_j\')">ارسال گزارش در تلگرام</button>')}
function openText(t,b){$('mTitle').textContent=t;$('mCaption').textContent='';$('mBody').innerHTML='<p>'+b+'</p>';$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
</script><script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a41366bf58fea167',t:'MTc5MDQzNzU4NQ=='};var a=document.createElement('script');a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})();</script></body></html>
