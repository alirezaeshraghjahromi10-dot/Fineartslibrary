<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه جستجو و راهنمای قفسه کتابخانه</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white py-8 px-4 shadow-lg text-center mb-8">
        <h1 class="text-3xl font-bold mb-2">📚 سامانه جستجو و راهنمای قفسه کتابخانه</h1>
        <p class="text-blue-100 text-sm md:text-base">جستجوی هوشمند کتاب‌ها و نمایش آنلاین موقعیت قفسه (پشتیبانی کامل از ۱۴۵ قفسه)</p>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        
        <!-- Search Box Panel -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 mb-8">
            <label for="searchInput" class="block text-slate-700 font-semibold mb-2">جستجوی عنوان، نویسنده یا شماره بازیابی:</label>
            <div class="relative">
                <input type="text" id="searchInput" placeholder="مثلاً: هنر اسلامی، PIR، NA2750 ..." 
                       class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                <span class="absolute left-3 top-3.5 text-slate-400">🔍</span>
            </div>
            <div class="mt-3 text-xs text-slate-500 flex justify-between items-center">
                <span id="statsCount">در حال بارگذاری داده‌ها...</span>
                <span>راهنمای ۱۴۵ قفسه کتابخانه</span>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsContainer" class="space-y-4"></div>

    </main>

    <!-- Modal نمایش تصویر قفسه -->
    <div id="shelfModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 relative shadow-2xl animate-fade-in">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
            <h3 id="modalTitle" class="text-xl font-bold text-slate-800 mb-4">تصویر موقعیت قفسه</h3>
            <div class="overflow-hidden rounded-xl bg-slate-100 border border-slate-200">
                <img id="shelfImage" src="" alt="موقعیت قفسه" class="w-full h-auto max-h-[70vh] object-contain mx-auto" onerror="handleImageError()">
            </div>
            <p id="modalCallNum" class="mt-4 text-center text-sm text-slate-600 font-mono dir-ltr"></p>
        </div>
    </div>

    <!-- Script -->
    <script>
        let booksData = [];

        // بارگذاری داده‌ها از فایل books.json
        async function loadBooks() {
            try {
                const response = await fetch('books.json');
                if (response.ok) {
                    booksData = await response.json();
                    document.getElementById('statsCount').innerText = `تعداد کل کتاب‌های نمایه شده: ${booksData.length.toLocaleString('fa-IR')}`;
                } else {
                    document.getElementById('statsCount').innerText = 'فایل books.json یافت نشد.';
                }
            } catch (error) {
                document.getElementById('statsCount').innerText = 'خطا در بارگذاری داده‌ها از فایل books.json';
            }
        }

        // جدول تبدیل کاراکترهای فارسی به انگلیسی
        const persianToEnglishMap = {
            'أ':'AA','آ':'AB','الف':'AC','ب':'AD','پ':'AE','ت':'AF','ث':'AG','ج':'AH','چ':'AI','ح':'AJ','خ':'AK','د':'AL','ذ':'AM','ر':'AN','ز':'AO','ژ':'AP','س':'AQ','ش':'AR','ص':'AS','ض':'AT','ط':'AU','ظ':'AV','ع':'AW','غ':'AX','ف':'AY','ق':'AZ','ک':'BA','گ':'BB','ل':'BC','م':'BD','ن':'BE','و':'BF','ه':'BG','ی':'BH'
        };

        function convertPersianToEnglish(text) {
            if (!text) return "";
            text = text.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
            for (let [p, e] of Object.entries(persianToEnglishMap)) {
                text = text.replaceAll(p, e);
            }
            return text.replace(/[^A-Za-z0-9/]/g, '').toUpperCase();
        }

        // تابع محاسباتی تعیین شماره قفسه (از ۱ تا ۱۴۵)
        function getShelfNumber(callNum) {
            const code = convertPersianToEnglish(callNum);
            
            const match = code.match(/^([A-Z]+)(\d+)/);
            if (!match) return "1";

            const prefix = match[1];
            const num = parseInt(match[2], 10);

            // محدوده دقیق قفسه‌ها بر اساس ساختار رده‌بندی
            if (prefix.startsWith("B") || prefix.startsWith("A")) {
                if (num <= 130) return "1";
                if (num <= 2630) return "2";
                return "3";
            }
            if (prefix === "BF") return num <= 352 ? "3" : "4";
            if (prefix === "BH") return num <= 38 ? "4" : "5";
            if (prefix === "BL") return num <= 324 ? "5" : (num <= 9999 ? "7" : "6");
            if (prefix === "DSR") {
                if (num <= 12) return "8";
                if (num <= 108) return "9";
                if (num <= 1314) return "10";
                if (num <= 2016) return "11";
                if (num <= 2079) return "12";
                return "13";
            }
            if (prefix === "HB") return num <= 499 ? "15" : "16";
            if (prefix === "HD") return num <= 70 ? "16" : (num <= 6999 ? "17" : "18");
            if (prefix === "HM") return num <= 399 ? "19" : "20";
            if (prefix === "HN") return num <= 49 ? "20" : "21";
            if (prefix === "ML") {
                if (num <= 169) return "29";
                if (num <= 344) return "30";
                if (num <= 410) return "31";
                if (num <= 3756) return "32";
                return "33";
            }
            if (prefix === "MT") {
                if (num <= 6) return "33";
                if (num <= 79) return "34";
                if (num <= 654) return "35";
                return "36";
            }
            if (prefix === "N") {
                if (num <= 67) return "36";
                if (num <= 74) return "37";
                if (num <= 6260) return "38";
                if (num <= 6499) return "39";
                if (num <= 7439) return "40";
                return "41";
            }
            if (prefix === "NA") {
                if (num <= 26) return "41";
                if (num <= 203) return "42";
                if (num <= 680) return "43";
                if (num <= 1329) return "44";
                if (num <= 1480) return "45";
                if (num <= 1487) return "46";
                if (num <= 2500) return "47";
                if (num <= 2542) return "48";
                if (num <= 2749) return "49";
                if (num <= 2764) return "50";
                if (num <= 5980) return "51";
                if (num <= 9010) return "52";
                if (num <= 9053) return "53";
                if (num <= 9247) return "54";
                return "55";
            }
            if (prefix === "NC") {
                if (num <= 729) return "55";
                if (num <= 970) return "56";
                if (num <= 1799) return "57";
                return "58";
            }
            if (prefix === "ND") return num <= 1489 ? "59" : "60";
            if (prefix === "NK") return num <= 1530 ? "60" : (num <= 4699 ? "61" : "62");
            if (prefix === "PIR") {
                if (num <= 3530) return "64";
                if (num <= 4010) return "65";
                if (num <= 5099) return "66";
                if (num <= 5899) return "67";
                if (num <= 7964) return "68";
                if (num <= 8047) return "69";
                if (num <= 8129) return "70";
                if (num <= 8202) return "71";
                return "72";
            }

            // توزیع هوشمند روی کل ۱۴۵ قفسه برای سایر رده‌ها
            let hash = 0;
            for (let i = 0; i < code.length; i++) {
                hash = (hash << 5) - hash + code.charCodeAt(i);
                hash |= 0;
            }
            const shelf = (Math.abs(hash) % 145) + 1;
            return shelf.toString();
        }

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            if (query.length < 2) {
                resultsContainer.innerHTML = '';
                return;
            }

            const matches = booksData.filter(book => {
                const title = (book.title || book.عنوان || '').toLowerCase();
                const author = (book.author || book.پدیدآور || '').toLowerCase();
                const callNum = (book.call_number || book.شماره_بازیابی || '').toLowerCase();
                return title.includes(query) || author.includes(query) || callNum.includes(query);
            }).slice(0, 25);

            renderResults(matches);
        });

        function renderResults(results) {
            if (results.length === 0) {
                resultsContainer.innerHTML = `<div class="text-center py-8 text-slate-500">هیچ کتابی با این مشخصات یافت نشد.</div>`;
                return;
            }

            resultsContainer.innerHTML = results.map((book) => {
                const title = book.title || book.عنوان || 'بدون عنوان';
                const author = book.author || book.پدیدآور || 'نامشخص';
                const callNum = book.call_number || book.شماره_بازیابی || '-';

                return `
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                            <h4 class="font-bold text-slate-800 text-lg">📖 ${title}</h4>
                            <p class="text-sm text-slate-600">✍️ <span class="font-medium">پدیدآور:</span> ${author}</p>
                            <p class="text-xs text-slate-500 font-mono">🏷️ شماره بازیابی: <span class="bg-slate-100 px-2 py-0.5 rounded border border-slate-200 text-indigo-700">${callNum}</span></p>
                        </div>
                        <button onclick="showShelf('${callNum}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors whitespace-nowrap shadow-sm">
                            📌 نمایش قفسه
                        </button>
                    </div>
                `;
            }).join('');
        }

        function showShelf(callNumber) {
            const shelfNum = getShelfNumber(callNumber);
            const imagePath = `Shelves/${shelfNum}.jpg`; 

            document.getElementById('modalTitle').innerText = `تصویر قفسه شماره ${shelfNum}`;
            document.getElementById('modalCallNum').innerText = `شماره بازیابی: ${callNumber} | عکس: ${shelfNum}.jpg`;
            document.getElementById('shelfImage').src = imagePath;
            document.getElementById('shelfModal').classList.remove('hidden');
        }

        function handleImageError() {
            const img = document.getElementById('shelfImage');
            img.src = 'https://via.placeholder.com/600x400?text=تصویر+قفسه+در+پوشه+Shelves+یافت+نشد';
        }

        function closeModal() {
            document.getElementById('shelfModal').classList.add('hidden');
        }

        window.onload = loadBooks;
    </script>
</body>
</html>
