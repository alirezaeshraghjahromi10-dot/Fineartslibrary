        };

        function convertPersianToEnglish(text) {
            if (!text) return "";
            text = text.toString().replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));

                text = text.replaceAll(p, e);
            }
            return text.replace(/[^A-Za-z0-9/]/g, '').toUpperCase();

            const code = convertPersianToEnglish(callNum);
            
            const match = code.match(/^([A-Z]+)(\d+)/);
            if (!match) return "1.jpg";

            const prefix = match[1];
            const num = parseInt(match[2], 10);

                if (num <= 130) return "1.jpg";
                if (num <= 2630) return "2.jpg";
                return "3.jpg";
            }
            if (prefix === "BF") return num <= 352 ? "3.jpg" : "4.jpg";
            if (prefix === "BH") return num <= 38 ? "4.jpg" : "5.jpg";
            if (prefix === "BL") return num <= 324 ? "5.jpg" : "7.jpg";

            }
            if (prefix === "ND") return num <= 1489 ? "59.jpg" : "60.jpg";
            if (prefix === "NK") return num <= 1530 ? "60.jpg" : (num <= 4699 ? "61.jpg" : "62.jpg");
            if (prefix === "PIR") {
                if (num <= 3530) return "64.jpg";
                if (num <= 4010) return "65.jpg";
                if (num <= 5099) return "66.jpg";
                if (num <= 5899) return "67.jpg";
                if (num <= 7964) return "68.jpg";
                if (num <= 8047) return "69.jpg";
                if (num <= 8129) return "70.jpg";
                if (num <= 8202) return "71.jpg";
                return "72.jpg";
            }
            if (prefix === "PN") {
                if (num <= 1589) return "74.jpg";
                if (num <= 1977) return "75.jpg";
                if (num <= 1995) return "76.jpg";
                if (num <= 1997) return "78.jpg";
                if (num <= 2053) return "80.jpg";
                if (num <= 2108) return "81.jpg";
                if (num <= 2956) return "82.jpg";
                return "83.jpg";
            }

            // ۲. بخش کدهای بخش لاتین (قفسه‌های ۹۹ تا ۱۴۵)
            if (prefix.length === 1 && prefix >= "C" && prefix <= "Z") {
                if (prefix <= "E") return "100.jpg";
                if (prefix === "F" || prefix === "G") return "101.jpg";
                if (prefix === "H") return "103.jpg";
                if (prefix === "J" || prefix === "K" || prefix === "L") return "106.jpg";
                if (prefix === "M") return num < 1000 ? "106.jpg" : "107.jpg";
                if (prefix === "Q") return "136.jpg";
                if (prefix === "R" || prefix === "S") return "137.jpg";
                if (prefix === "T") return "139.jpg";
                return "145.jpg";
            }

            // توزیع هوشمند برای موارد خاص
            let hash = 0;
            for (let i = 0; i < code.length; i++) {
                hash = (hash << 5) - hash + code.charCodeAt(i);
                hash |= 0;
            }
            const shelf = (Math.abs(hash) % 145) + 1;
            return shelf + ".jpg";
        }

        // همان بخش سرچ فایل خودتان
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            if (query.length < 2) {
                resultsContainer.innerHTML = '';
                return;
            }

            const matches = booksData.filter(book => {
                const title = (book.title || book.عنوان || '').toLowerCase();
                const author = (book.author || book.پدیدآور || '').toLowerCase();
                const callNum = (book.call_number || book.شماره_بازیابی || '').toLowerCase();
                return title.includes(query) || author.includes(query) || callNum.includes(query);
            }).slice(0, 25);

            renderResults(matches);
        });

        function renderResults(results) {
            if (results.length === 0) {
                resultsContainer.innerHTML = `<div class="text-center py-8 text-slate-500">هیچ کتابی با این مشخصات یافت نشد.</div>`;
                return;
            }

            resultsContainer.innerHTML = results.map((book) => {
                const title = book.title || book.عنوان || 'بدون عنوان';
                const author = book.author || book.پدیدآور || 'نامشخص';
                const callNum = book.call_number || book.شماره_بازیابی || '-';

                return `
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                            <h4 class="font-bold text-slate-800 text-lg">📖 ${title}</h4>
                            <p class="text-sm text-slate-600">✍️ <span class="font-medium">پدیدآور:</span> ${author}</p>
                            <p class="text-xs text-slate-500 font-mono">🏷️ شماره بازیابی: <span class="bg-slate-100 px-2 py-0.5 rounded border border-slate-200 text-indigo-700">${callNum}</span></p>
                        </div>
                        <button onclick="showShelf('${callNum}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors whitespace-nowrap shadow-sm">
                            📌 نمایش قفسه
                        </button>
                    </div>
                `;
            }).join('');
        }

        // نمایش تصویر و آدرس راهنمای قفسه
        function showShelf(callNumber) {
            const imgFile = getShelfNumber(callNumber);
            const imagePath = `Shelves/${imgFile}`; 
            const caption = shelfCaptions[imgFile] || "موقعیت قفسه در کتابخانه 📚";

            document.getElementById('modalTitle').innerText = `تصویر قفسه (${imgFile})`;
            document.getElementById('modalCaption').innerText = caption;
            document.getElementById('modalCallNum').innerText = `شماره بازیابی: ${callNumber} | عکس: ${imgFile}`;
            document.getElementById('shelfImage').src = imagePath;
            document.getElementById('shelfModal').classList.remove('hidden');
        }

        function handleImageError() {
            const img = document.getElementById('shelfImage');
            img.src = 'https://via.placeholder.com/600x400?text=تصویر+قفسه+در+پوشه+Shelves+یافت+نشد';
        }

        function closeModal() {
            document.getElementById('shelfModal').classList.add('hidden');
        }

        window.onload = loadBooks;
    </script>
</body>
</html>
