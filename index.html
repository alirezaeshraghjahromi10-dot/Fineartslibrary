        function convertPersianToEnglish(text) {
            if (!text) return "";
            text = text.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
            for (let [p, e] of Object.entries(persianToEnglishMap)) {
                text = text.replaceAll(p, e);
            }
            return text.replace(/[^A-Za-z0-9/]/g, '').toUpperCase();

        // منطق مقایسه دقیق رشته‌های رده‌بندی پایتون
        function isCodeInRange(code, startCode, endCode) {
            return code.localeCompare(startCode, 'en', { numeric: true, sensitivity: 'base' }) >= 0 &&
                   code.localeCompare(endCode, 'en', { numeric: true, sensitivity: 'base' }) <= 0;
        }

        function getShelfImageAndCaption(callNumber) {
            const code = convertPersianToEnglish(callNumber);
            if (!code) return { img: "1.jpg", caption: shelfCaptions["1.jpg"] };

            // ۱. بررسی در لیست فارسی
            for (let [range, img] of bookCodeRangesPersian) {
                if (isCodeInRange(code, range[0], range[1])) {
                    return { img: img, caption: shelfCaptions[img] || "" };
                }
            }

            // ۲. بررسی در لیست لاتین
            for (let [range, img] of bookCodeRangesLatin) {
                if (isCodeInRange(code, range[0], range[1])) {
                    return { img: img, caption: shelfCaptions[img] || "" };
                }
            }

            // پیش‌فرض در صورت عدم تطابق
            return { img: "1.jpg", caption: shelfCaptions["1.jpg"] };
        }

        async function loadBooks() {
            try {
                const response = await fetch('books.json');
                if (response.ok) {
                    booksData = await response.json();
                    document.getElementById('statsCount').innerText = `تعداد کتاب‌های نمایه شده: ${booksData.length.toLocaleString('fa-IR')}`;
                } else {
                    document.getElementById('statsCount').innerText = 'فایل books.json یافت نشد.';
                }
            } catch (error) {
                document.getElementById('statsCount').innerText = 'خطا در خواندن داده‌ها از books.json';
            }
        }

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            if (query.length < 2) {
                resultsContainer.innerHTML = '';
                return;
            }

            const matches = booksData.filter(book => {
                const title = (book.title || book.عنوان || '').toLowerCase();
                const author = (book.author || book.پدیدآور || '').toLowerCase();
                const callNum = (book.call_number || book.شماره_بازیابی || '').toLowerCase();
                return title.includes(query) || author.includes(query) || callNum.includes(query);
            }).slice(0, 30);

            renderResults(matches);
        });

        function renderResults(results) {
            if (results.length === 0) {
                resultsContainer.innerHTML = `<div class="text-center py-8 text-slate-500">هیچ کتابی با این مشخصات یافت نشد.</div>`;
                return;
            }

            resultsContainer.innerHTML = results.map((book) => {
                const title = book.title || book.عنوان || 'بدون عنوان';
                const author = book.author || book.پدیدآور || 'نامشخص';
                const callNum = book.call_number || book.شماره_بازیابی || '-';

                return `
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                            <h4 class="font-bold text-slate-800 text-lg">📖 ${title}</h4>
                            <p class="text-sm text-slate-600">✍️ <span class="font-medium">پدیدآور:</span> ${author}</p>
                            <p class="text-xs text-slate-500 font-mono">🏷️ شماره بازیابی: <span class="bg-slate-100 px-2 py-0.5 rounded border border-slate-200 text-indigo-700">${callNum}</span></p>
                        </div>
                        <button onclick="showShelf('${callNum}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors whitespace-nowrap shadow-sm">
                            📌 نمایش موقعیت قفسه
                        </button>
                    </div>
                `;
            }).join('');
        }

        function showShelf(callNumber) {
            const shelfData = getShelfImageAndCaption(callNumber);
            const imagePath = `Shelves/${shelfData.img}`; 

            document.getElementById('modalTitle').innerText = `تصویر قفسه (${shelfData.img})`;
            document.getElementById('modalCaption').innerText = shelfData.caption;
            document.getElementById('modalCallNum').innerText = `شماره بازیابی: ${callNumber} | کد سیستمی: ${convertPersianToEnglish(callNumber)}`;
            document.getElementById('shelfImage').src = imagePath;
            document.getElementById('shelfModal').classList.remove('hidden');
        }

        function handleImageError() {
            const img = document.getElementById('shelfImage');
            img.src = 'https://via.placeholder.com/600x400?text=تصویر+قفسه+در+پوشه+Shelves+یافت+نشد';
        }

        function closeModal() {
            document.getElementById('shelfModal').classList.add('hidden');
        }

        window.onload = loadBooks;
