<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه جستجوی کتابخانه هنرهای زیبا</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Vazirmatn","Tahoma",sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;}
header{background:linear-gradient(135deg,#1e3a5f,#2d5986);color:#fff;padding:28px 20px;text-align:center;}
header h1{font-size:1.5rem;margin-bottom:6px;}
header p{font-size:.88rem;opacity:.85;}
.container{max-width:860px;margin:0 auto;padding:20px 14px 60px;}
.search-box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:14px;}
.search-box label{display:block;font-weight:700;margin-bottom:10px;color:#1e3a5f;font-size:.95rem;}
.input-wrap{position:relative;}
.input-wrap input{width:100%;padding:13px 14px 13px 42px;border:2px solid #e2e8f0;border-radius:12px;font-size:1rem;font-family:inherit;transition:.2s;outline:none;background:#f8fafc;}
.input-wrap input:focus{border-color:#2d5986;background:#fff;}
.input-wrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none;}
.stats{margin-top:10px;font-size:.8rem;color:#64748b;display:flex;justify-content:space-between;align-items:center;}
#statsOk{color:#16a34a;font-weight:600;}
#statsErr{color:#dc2626;font-weight:600;display:none;}
.loading{animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.filter-btn{padding:6px 16px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-size:.8rem;font-family:inherit;transition:.15s;}
.filter-btn.active,.filter-btn:hover{background:#1e3a5f;color:#fff;border-color:#1e3a5f;}
.results{display:flex;flex-direction:column;gap:10px;}
.result-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.07);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-right:4px solid #2d5986;}
.result-card.en{border-right-color:#7c3aed;}
.result-info h3{font-size:.97rem;font-weight:700;margin-bottom:5px;line-height:1.6;}
.result-info p{font-size:.8rem;color:#475569;margin-bottom:2px;line-height:1.7;}
.code-badge{display:inline-block;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:2px 9px;font-size:.75rem;font-family:monospace;color:#1e3a5f;direction:ltr;margin-top:4px;}
.shelf-btn{flex-shrink:0;background:#1e3a5f;color:#fff;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:.8rem;font-family:inherit;font-weight:600;transition:.15s;white-space:nowrap;}
.shelf-btn:hover{background:#2d5986;}
.empty,.hint{text-align:center;padding:36px 20px;color:#94a3b8;font-size:.9rem;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:100;backdrop-filter:blur(3px);}
.modal-overlay.hidden{display:none;}
.modal-box{background:#fff;border-radius:18px;max-width:620px;width:100%;padding:22px;position:relative;max-height:92vh;overflow-y:auto;}
.modal-close{position:absolute;top:12px;left:14px;background:none;border:none;font-size:1.8rem;cursor:pointer;color:#94a3b8;line-height:1;}
.modal-close:hover{color:#1e293b;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:3px;padding-left:30px;}
.modal-caption{color:#2d5986;font-size:.85rem;font-weight:600;margin-bottom:12px;}
.modal-img-wrap{background:#f8fafc;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;}
.modal-img-wrap img{width:100%;height:auto;max-height:58vh;object-fit:contain;display:block;}
.modal-code{text-align:center;font-size:.72rem;color:#94a3b8;margin-top:10px;font-family:monospace;direction:ltr;}
@media(max-width:520px){
  .result-card{flex-direction:column;}
  .shelf-btn{width:100%;}
  header h1{font-size:1.25rem;}
}
</style>
</head>
<body>
<header>
  <h1>📚 سامانه جستجوی کتابخانه هنرهای زیبا</h1>
  <p>جستجو در بیش از ۱۸٬۰۰۰ عنوان کتاب فارسی و لاتین — ۱۴۵ قفسه</p>
</header>
<div class="container">
  <div class="search-box">

      <span class="icon">🔍</span>
    </div>
    <div class="stats">
      <span id="statsOk"><span class="loading">در حال بارگذاری...</span></span>
      <span id="statsErr"></span>
      <span>۱۴۵ قفسه</span>
    </div>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-lang="all">همه</button>
    <button class="filter-btn" data-lang="fa">فارسی</button>
    <button class="filter-btn" data-lang="en">لاتین</button>
  </div>
  <div class="results" id="results">
    <div class="hint">در حال بارگذاری اطلاعات کتاب‌ها...</div>
  </div>
</div>
<div class="modal-overlay hidden" id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-caption" id="mCaption"></div>
    <div class="modal-img-wrap"><img id="mImg" src="" alt="قفسه" onerror="this.src='https://placehold.co/600x400?text=عکس+یافت+نشد'"></div>
    <div class="modal-code" id="mCode"></div>
  </div>
</div>

  .then(r=>{if(!r.ok)throw new Error('کد '+r.status);return r.json();})
  .then(data=>{
    BOOKS=data;
    document.getElementById('q').disabled=false;
    document.getElementById('statsOk').textContent='تعداد کتاب‌ها: '+BOOKS.length.toLocaleString('fa-IR')+' عنوان';
    document.getElementById('results').innerHTML='<div class="hint">برای جستجو تایپ کنید...</div>';
  })
  .catch(err=>{
    document.getElementById('statsOk').style.display='none';
    const e=document.getElementById('statsErr');
    e.style.display='';

    document.getElementById('results').innerHTML='<div class="empty">⚠️ فایل اطلاعات کتاب‌ها بارگذاری نشد.</div>';
  });
function getShelf(c){if(!c)return 1;const m=c.match(/^([A-Z]+)\s*(\d+)/);if(!m)return 1;const p=m[1],n=parseInt(m[2])||0;for(const[rp,rs,re,img]of RANGES){if(rp===p&&n>=rs&&n<=re)return img;}return 1;}
function norm(s){if(!s)return'';return s.replace(/[أإآا]/g,'ا').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u065F]/g,'').toLowerCase();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.getElementById('q').addEventListener('input',function(){clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,220);});
document.getElementById('filters').addEventListener('click',function(e){const btn=e.target.closest('.filter-btn');if(!btn)return;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');langFilter=btn.dataset.lang;doSearch();});
function doSearch(){
  const q=norm(document.getElementById('q').value.trim());
  const res=document.getElementById('results');
  if(q.length<2){res.innerHTML='<div class="hint">برای جستجو تایپ کنید...</div>';return;}
  const terms=q.split(/\s+/).filter(Boolean);
  let pool=BOOKS;
  if(langFilter!=='all')pool=pool.filter(b=>b.l===langFilter);
  const scored=[];
  for(const b of pool){
    const t=norm(b.t),a=norm(b.a),c=(b.c||'').toLowerCase(),cat=norm(b.cat);
    let sc=0;
    for(const term of terms){if(t.includes(term))sc+=3;if(a.includes(term))sc+=2;if(c.includes(term))sc+=4;if(cat.includes(term))sc+=1;}
    if(sc>0)scored.push([sc,b]);
  }
  scored.sort((x,y)=>y[0]-x[0]);
  const top=scored.slice(0,30);
  if(top.length===0){res.innerHTML='<div class="empty">📭 کتابی یافت نشد.</div>';return;}
  res.innerHTML=top.map(([sc,b])=>{
    const safe=(b.c||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return`<div class="result-card ${b.l==='en'?'en':''}">
      <div class="result-info">
        <h3>${esc(b.t||'بدون عنوان')}</h3>
        <p>✍️ ${esc(b.a||'نامشخص')}</p>
        ${b.y?`<p>📅 ${esc(b.y)}</p>`:''}
        ${b.cat?`<p>🏷️ ${esc(b.cat)}</p>`:''}
        <span class="code-badge">${esc(b.c||'-')}</span>
      </div>
      <button class="shelf-btn" onclick="showShelf('${safe}')">📌 موقعیت قفسه</button>
    </div>`;
  }).join('');
}
function showShelf(code){const n=getShelf(code);document.getElementById('mTitle').textContent='قفسه شماره '+n;document.getElementById('mCaption').textContent='📍 '+(CAPS[String(n)]||'');document.getElementById('mImg').src='Shelves/'+n+'.jpg';document.getElementById('mCode').textContent='شماره بازیابی: '+code;document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
